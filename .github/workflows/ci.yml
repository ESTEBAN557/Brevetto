# =============================================================================
# Brevetto – Continuous Integration Pipeline (Phase 1)
# Triggered on every Pull Request targeting main.
#
# Jobs:
#   frontend  – lint, type checking, build
#   backend   – Django system checks, pytest (focused)
#   infra     – Docker Compose config validation
#
# References:
#   Continuous-Integration wiki page (Phase 1 – Initial Validation)
#   Static-Code-Analysis wiki page
# =============================================================================

name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # Frontend: ESLint + TypeScript + Next.js build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type checking
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Backend: Django system checks + pytest
  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: brevetto_test
          POSTGRES_USER: brevetto
          POSTGRES_PASSWORD: brevetto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brevetto -d brevetto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      minio:
        image: quay.io/minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        # minio requires a command; the service container needs an entrypoint override
        # This is handled by the image default; add --console-address if needed.

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SECRET_KEY: ci-insecure-key-only-for-testing
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      POSTGRES_DB: brevetto_test
      POSTGRES_USER: brevetto
      POSTGRES_PASSWORD: brevetto
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_STORAGE_BUCKET_NAME: brevetto-docs
      AWS_S3_REGION_NAME: us-east-1
      AWS_S3_ENDPOINT_URL: http://localhost:9000
      AWS_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      PRESIGNED_URL_EXPIRATION_SECONDS: "900"
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-3.5-flash
      GEMINI_FALLBACK_MODEL: gemini-3-flash-preview
      AI_CONFIDENCE_THRESHOLD: "0.85"
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: Run tests
        run: pytest -q

  # ---------------------------------------------------------------------------
  # Infrastructure: Docker Compose config validation
  # ---------------------------------------------------------------------------
  infra:
    name: Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy env example
        run: cp .env.example .env

      - name: Validate Docker Compose config
        run: docker compose config

  # ---------------------------------------------------------------------------
  # Security: dependency vulnerability audits (Security-Analysis §1 and §6)
  #   - pip-audit : known vulnerabilities in Python dependencies
  #   - npm audit : known vulnerabilities in frontend dependencies
  # ---------------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Python dependency audit
        run: pip-audit -r backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
