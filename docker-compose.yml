# ---------------------------------------------------------------------------
# Brevetto — Entorno de desarrollo con paridad de contenedores (Fase 1)
# Servicios: db, redis, minio, backend, celery_worker, frontend
# Uso:  cp .env.example .env && docker compose up -d --build
# ---------------------------------------------------------------------------
name: brevetto

services:
  # ------------------------------------------------------------------ DB ---
  db:
    image: postgres:16-alpine
    container_name: brevetto_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brevetto}
      POSTGRES_USER: ${POSTGRES_USER:-brevetto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brevetto}
      TZ: America/Bogota
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brevetto} -d ${POSTGRES_DB:-brevetto}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------- REDIS ---
  redis:
    image: redis:7-alpine
    container_name: brevetto_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --------------------------------------------------------------- MINIO ---
  minio:
    image: quay.io/minio/minio:latest   # Docker Hub ya no publica minio/minio; registro oficial en quay.io
    container_name: brevetto_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # API compatible con S3
      - "9001:9001"   # Consola web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------- BACKEND ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brevetto_backend
    restart: unless-stopped
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ------------------------------------------------------- CELERY WORKER ---
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brevetto_celery_worker
    restart: unless-stopped
    entrypoint: []   # el worker no debe correr migraciones; solo el backend lo hace
    # -B: incluye Celery beat (tarea periódica que re-encola documentos estancados)
    command: ["celery", "-A", "config", "worker", "-B", "-l", "info", "--concurrency=2", "--schedule=/tmp/celerybeat-schedule"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ------------------------------------------------------------ FRONTEND ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brevetto_frontend
    restart: unless-stopped
    command: ["npm", "run", "dev"]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules:
